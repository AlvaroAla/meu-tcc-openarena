// Configuração do servidor OpenArena para experimentos
set sv_hostname "Servidor OpenArena - Experimentos Bots"
//set com_hunkMegs 256
set g_motd "Carga com bots (senoidal) - Captura de tráfego"
set g_gametype 0            // 0=Free For All, 4=CTF, etc.
set sv_maxclients 64
set bot_enable 1
//set bot_minplayers 6        // valor inicial; será ajustado via RCON pelo script
set rconPassword "admin123" // troque em produção
set sv_allowDownload 1
set g_doWarmup 0
set timelimit 0
set fraglimit 0
set capturelimit 0
set sv_fps 125
set bot_challenge 1
set g_spSkill 5
set bot_nochat 0
set sv_fps 500
set g_weaponrespawn 1

// Rotação de mapa simples
map oa_dm1
